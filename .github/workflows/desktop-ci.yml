name: Desktop Shell

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      CARGO_TERM_COLOR: never
      # The vendored OpenSSL build needs a native Perl on Windows, not Git Bash's.
      PERL: ${{ matrix.os == 'windows-latest' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact Git HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Select the runner's Node from its tool cache
        shell: bash
        run: |
          # The trailing slash keeps directories only: each version also holds an `x64.complete` marker file.
          node_dir=$(ls -d "$RUNNER_TOOL_CACHE"/node/2[24].*/*/ | sort -V | tail -n 1)
          node_dir=${node_dir%/}
          test -n "$node_dir"
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$node_dir"; else echo "$node_dir/bin"; fi >> "$GITHUB_PATH"
      - name: Check Node comes from the tool cache and supports type stripping
        shell: bash
        run: |
          command -v node
          node --version
          case "$(command -v node)" in *hostedtoolcache*) ;; *) exit 1 ;; esac
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); process.exit(major > 22 || (major === 22 && minor >= 6) ? 0 : 1)"
      - name: Install pinned toolchain
        shell: bash
        working-directory: product
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Install Linux WebView libraries
        if: matrix.os == 'ubuntu-latest'
        # These checks are required, so a stuck package mirror must fail fast instead of blocking merges.
        timeout-minutes: 10
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Install locked npm packages
        shell: bash
        working-directory: product/apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend tests
        shell: bash
        working-directory: product/apps/desktop
        run: npm test
      - name: Type-check and build the frontend
        shell: bash
        working-directory: product/apps/desktop
        run: npm run build
      - name: Fetch locked dependencies
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Check TA-29 for the desktop binary
        shell: bash
        run: python tools/ci/ta29_desktop_denial.py
      - name: Check formatting
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Run clippy
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run native tests
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo test --locked
