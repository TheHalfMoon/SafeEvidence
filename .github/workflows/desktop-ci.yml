name: Desktop Shell

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      CARGO_TERM_COLOR: never
      # The vendored OpenSSL build needs a native Perl on Windows, not Git Bash's.
      PERL: ${{ matrix.os == 'windows-latest' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact Git HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install pinned toolchain
        shell: bash
        working-directory: product
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Install Linux WebView libraries
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Install locked npm packages
        shell: bash
        working-directory: product/apps/desktop
        run: npm ci --ignore-scripts=false --no-audit --no-fund
      - name: Run frontend tests
        shell: bash
        working-directory: product/apps/desktop
        run: npm test
      - name: Type-check and build the frontend
        shell: bash
        working-directory: product/apps/desktop
        run: npm run build
      - name: Fetch locked dependencies
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Check TA-29 for the desktop binary
        shell: bash
        run: python tools/ci/ta29_desktop_denial.py
      - name: Check formatting
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Run clippy
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run native tests
        shell: bash
        working-directory: product/apps/desktop/src-tauri
        run: cargo test --locked
