name: Product Workspace

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product:
    name: product (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      CARGO_TERM_COLOR: never
      # The vendored OpenSSL build needs a native Perl on Windows, not Git Bash's.
      PERL: ${{ matrix.os == 'windows-latest' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact Git HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate source admissions
        shell: bash
        run: python tools/governance/source_admission_check.py --root .
      - name: Install pinned toolchain
        shell: bash
        working-directory: product
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Fetch locked dependencies
        shell: bash
        working-directory: product
        run: cargo fetch --locked
      - name: Install cargo-deny
        shell: bash
        run: cargo +1.98.1 install cargo-deny --version 0.20.2 --locked
      - name: Fetch advisory database
        shell: bash
        working-directory: product
        run: cargo deny fetch
      - name: Run TA-03 checks under OS network isolation
        shell: bash
        working-directory: product
        run: bash ../tools/ci/ta03_isolated.sh
