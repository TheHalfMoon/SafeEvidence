# cargo-deny configuration for the desktop app's own workspace, which `product/deny.toml` does not cover.
# It follows that file, scoped to the three desktop targets: Tauri pulls `reqwest` and `hyper` only for
# Android and iOS, which this app does not build yet.

[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = [
    # glib 0.18 is reached through Tauri's GTK 3 and WebKitGTK stack on Linux, with no fixed version
    # within Tauri 2. The unsound API (`VariantStrIter`) is not called by this app's code.
    { id = "RUSTSEC-2024-0429", reason = "Linux GTK 3 stack under Tauri 2; no fixed version; API unused here" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The app depends on the product crates by path, which has no version to pin.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "reqwest" },
    { crate = "ureq" },
    { crate = "hyper" },
    { crate = "hf-hub" },
    { crate = "liter-llm" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
