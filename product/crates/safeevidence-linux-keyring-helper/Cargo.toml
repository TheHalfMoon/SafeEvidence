[package]
name = "safeevidence-linux-keyring-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
safeevidence-keyring-wire = { version = "=0.0.0", path = "../safeevidence-keyring-wire" }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
zeroize = { version = "=1.9.0" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
safeevidence-vault = { version = "=0.0.0", path = "../safeevidence-vault" }
